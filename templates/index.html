<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Mole</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gradient-to-b from-sky-400 via-emerald-300 to-green-600 min-h-screen text-slate-800 font-['Fredoka'] flex flex-col items-center justify-between p-4 select-none">

  <!-- Main Container -->
  <div class="w-full max-w-2xl flex flex-col items-center">
    
    <!-- Header -->
    <header class="text-center my-3">
      <h1 class="text-4xl md:text-5xl font-black text-amber-100 drop-shadow-[0_4px_4px_rgba(0,0,0,0.4)] tracking-wide">
        WHACK-A-MOLE
      </h1>
      <p class="text-emerald-950 font-semibold text-sm md:text-base mt-1">
        Pukul tikus sebanyak-banyaknya dalam 30 detik! Hati-hati dengan bom!
      </p>
    </header>

    <!-- Scoreboard & Timer -->
    <div class="w-full bg-amber-50/90 backdrop-blur-sm border-4 border-amber-800/80 rounded-3xl p-4 shadow-xl flex items-center justify-around gap-2 mb-4">
      <!-- Skor Saat Ini -->
      <div class="flex flex-col items-center">
        <span class="text-xs uppercase tracking-wider text-amber-800 font-bold">Skor</span>
        <span id="score" class="text-3xl md:text-4xl font-extrabold text-amber-600">0</span>
      </div>

      <!-- Pemisah -->
      <div class="h-10 w-0.5 bg-amber-300 rounded-full"></div>

      <!-- Waktu Tersisa -->
      <div class="flex flex-col items-center">
        <span class="text-xs uppercase tracking-wider text-amber-800 font-bold">Waktu</span>
        <div class="flex items-baseline">
          <span id="timer" class="text-3xl md:text-4xl font-extrabold text-red-500">30</span>
          <span class="text-xs font-bold text-red-400 ml-1">dtk</span>
        </div>
      </div>

      <!-- Pemisah -->
      <div class="h-10 w-0.5 bg-amber-300 rounded-full"></div>

      <!-- Rekor Tertinggi -->
      <div class="flex flex-col items-center">
        <span class="text-xs uppercase tracking-wider text-amber-800 font-bold">High Score</span>
        <span id="high-score" class="text-3xl md:text-4xl font-extrabold text-emerald-600">0</span>
      </div>
    </div>

    <!-- Panduan Karakter / Legend -->
    <div class="flex flex-wrap items-center justify-center gap-3 text-xs md:text-sm font-semibold mb-4 text-emerald-950">
      <div class="flex items-center gap-1.5 bg-amber-100/90 px-3 py-1 rounded-full shadow border border-amber-300">
        <span>Tikus Biasa</span>
        <span class="text-emerald-700 font-bold">+10</span>
      </div>
      <div class="flex items-center gap-1.5 bg-yellow-200/90 px-3 py-1 rounded-full shadow border border-yellow-400">
        <span>Tikus Emas</span>
        <span class="text-amber-800 font-bold">+25</span>
      </div>
      <div class="flex items-center gap-1.5 bg-rose-200/90 px-3 py-1 rounded-full shadow border border-rose-400">
        <span>Bom</span>
        <span class="text-red-700 font-bold">-15</span>
      </div>
    </div>

    <!-- Papan Permainan Grid 3x3 -->
    <div id="game-board" class="game-board grid grid-cols-3 gap-3 md:gap-5 w-full max-w-lg aspect-square bg-gradient-to-b from-green-700 to-green-800 p-4 md:p-6 rounded-3xl border-8 border-green-900 shadow-2xl">
      <!-- 9 Lubang -->
      <div class="hole" data-index="0">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="1">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="2">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="3">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="4">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="5">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="6">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="7">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
      <div class="hole" data-index="8">
        <div class="mole"></div>
        <div class="dirt"></div>
      </div>
    </div>

    <!-- Tombol Kontrol -->
    <div class="flex items-center justify-center gap-4 mt-6">
      <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold text-lg md:text-xl rounded-full shadow-[0_6px_0_#9a3412] active:translate-y-1 active:shadow-[0_2px_0_#9a3412] transition-all">
        Mulai Game
      </button>

      <button id="sound-btn" class="p-3 bg-white/80 hover:bg-white text-emerald-900 rounded-full shadow border-2 border-emerald-700/30 transition-all" title="Nyalakan/Matikan Suara">
        <span id="sound-icon" class="text-xl">🔊</span>
      </button>

      <button id="reset-highscore-btn" class="text-xs text-emerald-900 hover:text-red-700 underline font-semibold ml-1 transition-colors">
        Reset High Score
      </button>
    </div>

  </div>

  <!-- Modal Game Over -->
  <div id="game-over-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-amber-50 border-4 border-amber-800 rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl transform transition-all scale-95 animate-pop">
      <h2 class="text-3xl font-black text-amber-900 mb-1">WAKTU HABIS!</h2>
      <p id="new-record-badge" class="inline-block bg-yellow-400 text-amber-950 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4 hidden">
        Rekor Baru Tercipta!
      </p>

      <div class="bg-amber-100/80 rounded-2xl p-4 mb-6 border border-amber-300">
        <div class="text-sm text-amber-800 font-semibold mb-1">Skor Akhir Kamu</div>
        <div id="final-score" class="text-5xl font-black text-amber-600">0</div>
        
        <div class="flex justify-between items-center text-xs text-amber-700 font-bold border-t border-amber-200 mt-3 pt-3">
          <span>Pukulan Berhasil:</span>
          <span id="total-hits" class="text-sm text-emerald-700 font-extrabold">0</span>
        </div>
      </div>

      <button id="restart-btn" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-extrabold text-lg rounded-2xl shadow-[0_5px_0_#14532d] active:translate-y-1 active:shadow-[0_1px_0_#14532d] transition-all">
         Main Lagi
      </button>
    </div>
  </div>

  <!-- Game Logic Script -->
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
